name: Sync Version From Tag

# Keeps the plugin's version-bearing files in step with the git tag. When a tag
# is pushed (or run manually) this normalizes the tag (v0.4.0 -> 0.4.0), writes
# it into every published file via bin/set-version.sh, and — if anything was out
# of sync — commits the fix back to the default branch and re-points the tag at
# the corrected commit.

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to set (e.g. 0.4.0 or v0.4.0)'
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: 'Version to set (e.g. 0.4.0 or v0.4.0)'
        required: true
        type: string
    outputs:
      version:
        description: 'Normalized version that was written'
        value: ${{ jobs.sync.outputs.version }}
      changed:
        description: 'Whether any file needed updating'
        value: ${{ jobs.sync.outputs.changed }}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.sync.outputs.version }}
      changed: ${{ steps.sync.outputs.changed }}

    steps:
      - name: Determine target branch
        id: target
        shell: bash
        run: echo "branch=${{ github.event.repository.default_branch }}" >> "${GITHUB_OUTPUT}"

      - name: Checkout default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.target.outputs.branch }}
          fetch-depth: 0

      - name: Set version and commit back
        id: sync
        shell: bash
        env:
          # For a tag push github.ref_name is the tag; for manual/reusable runs use the input.
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
          TAG_REF: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          TARGET_BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          VERSION="${RAW_VERSION#v}"
          bash bin/set-version.sh "${VERSION}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"

          if git diff --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Version already ${VERSION}; nothing to commit."
            exit 0
          fi

          echo "changed=true" >> "${GITHUB_OUTPUT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "chore: sync version to ${VERSION}"
          git push origin "HEAD:${TARGET_BRANCH}"

          # If this run was triggered by a tag, move that tag onto the corrected
          # commit so releases built from it ship the right version.
          if [[ -n "${TAG_REF}" ]]; then
            git tag -f "${TAG_REF}"
            git push -f origin "refs/tags/${TAG_REF}"
            echo "Moved tag ${TAG_REF} to the corrected commit."
          fi
