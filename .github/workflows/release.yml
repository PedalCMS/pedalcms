name: Release Plugin Zip

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Setup Node
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install Node dependencies
        if: ${{ hashFiles('package.json') != '' }}
        run: npm ci

      - name: Build frontend assets
        if: ${{ hashFiles('package.json') != '' }}
        run: npm run build

      - name: Setup PHP
        if: ${{ hashFiles('composer.json') != '' }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install production Composer dependencies
        if: ${{ hashFiles('composer.json') != '' }}
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress

      - name: Build and validate release zip
        shell: bash
        run: bash bin/build-release-zip.sh "${RUNNER_TEMP}/pedalcms.zip"

      - name: Build Playground bundle
        shell: bash
        run: bash bin/build-playground-bundle.sh "${RUNNER_TEMP}/pedalcms.zip" "${RUNNER_TEMP}/pedalcms-playground.zip"

      - name: Smoke test Playground demo
        run: node scripts/test-playground.mjs "${RUNNER_TEMP}/pedalcms-playground.zip"

      - name: Upload manual-run artifacts
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v7
        with:
          name: pedalcms-playground-preview
          path: |
            ${{ runner.temp }}/pedalcms.zip
            ${{ runner.temp }}/pedalcms-playground.zip

      - name: Upload zip to GitHub Release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/pedalcms.zip

      - name: Generate release Playground URL
        if: ${{ github.event_name == 'release' }}
        shell: bash
        run: |
          PLAYGROUND_URL="$(node scripts/playground-blueprint.mjs release-url \
            "${GITHUB_REPOSITORY}" \
            "${{ github.event.release.tag_name }}" \
            "${GITHUB_SHA}")"
          echo "PLAYGROUND_URL=${PLAYGROUND_URL}" >> "${GITHUB_ENV}"

      - name: Add Playground link to release description
        if: ${{ github.event_name == 'release' }}
        uses: actions/github-script@v8
        env:
          RELEASE_ID: ${{ github.event.release.id }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const startMarker = '<!-- pedalcms-playground:start -->';
            const endMarker = '<!-- pedalcms-playground:end -->';
            const section = [
              startMarker,
              '## Live demo',
              '',
              `[Launch this release in WordPress Playground](${process.env.PLAYGROUND_URL})`,
              endMarker,
            ].join('\n');
            const markerPattern = new RegExp(
              `\\n?${startMarker}[\\s\\S]*?${endMarker}\\n?`,
              'g',
            );
            const originalBody = context.payload.release.body || '';
            const preservedBody = originalBody.replace(markerPattern, '').trimEnd();
            const body = preservedBody ? `${preservedBody}\n\n${section}` : section;

            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              body,
            });
