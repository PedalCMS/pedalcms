name: PHPUnit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental == true }}

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        wp: ['6.9', 'latest']
        experimental: [false]
        include:
          - php: '8.4'
            wp: 'trunk'
            experimental: true

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: pedalcms_test
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    env:
      WP_TESTS_DIR: /tmp/wordpress-tests-lib
      WP_CORE_DIR: /tmp/wordpress

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4

      - name: Install Subversion
        run: sudo apt-get update && sudo apt-get install -y subversion

      - name: Install WordPress test suite
        env:
          DELETE_EXISTING_DB: 'y'
        run: bash bin/install-wp-tests.sh pedalcms_test root root 127.0.0.1 ${{ matrix.wp }}

      - name: Run PHPUnit (single site)
        run: vendor/bin/phpunit --no-coverage

      - name: Run PHPUnit (multisite)
        run: vendor/bin/phpunit -c tests/phpunit/multisite.xml --no-coverage
